name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # X11 dev packages Dear ImGui's GLFW backend needs on Linux.
  LINUX_X11_DEPS: >-
    libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev
    libxcursor-dev libxi-dev libxkbcommon-dev

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-latest
          - name: macos-clang
            os: macos-latest
          - name: windows-clang64
            os: windows-latest

    defaults:
      run:
        shell: ${{ matrix.name == 'windows-clang64' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain (Linux)
        if: matrix.name == 'linux-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake $LINUX_X11_DEPS

      - name: Install toolchain (macOS)
        if: matrix.name == 'macos-clang'
        run: brew install ninja

      - name: Install toolchain (Windows / MSYS2 clang64)
        if: matrix.name == 'windows-clang64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          # Don't run a full `pacman -Syuu` (flaky mirrors); the base image is
          # recent enough and we pin nothing that needs the very latest.
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  lint:
    name: clang-format + clang-tidy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 21 + deps
        run: |
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tidy-21 clang-format-21 ninja-build cmake $LINUX_X11_DEPS
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100

      - name: Configure (for compile_commands.json)
        run: cmake --preset debug

      - name: Generate build-time headers (for clang-tidy)
        # clang-tidy parses each TU against compile_commands.json without
        # actually building, so generated headers -- e.g. the JetBrains Mono
        # font header main.cpp includes (see cmake/Dependencies.cmake) --
        # still need to exist on disk first, or clang-tidy fails to find them.
        run: cmake --build --preset debug --target generate_jetbrains_mono_header

      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-21 --dry-run --Werror

      - name: clang-tidy
        run: |
          git ls-files '*.cpp' | grep -E '^(src|app|tests)/' \
            | xargs clang-tidy-21 -p build/debug --warnings-as-errors='*'
